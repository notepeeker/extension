name: Publish extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate extension files
        run: |
          node --check background.js
          node --check content.js
          node --check viewer/viewer.js
          node --check epub/epub.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.firefox.json', 'utf8'))"

      - name: Package Chrome and Firefox extensions
        run: |
          rm -rf chrome-package firefox-package notepeeker-chrome.zip notepeeker-firefox.zip
          mkdir chrome-package firefox-package
          cp manifest.json chrome-package/manifest.json
          cp manifest.firefox.json firefox-package/manifest.json
          cp background.js content.js LICENSE README.md chrome-package/
          cp background.js content.js LICENSE README.md firefox-package/
          cp -R viewer source epub vendor components chrome-package/
          cp -R viewer source epub vendor components firefox-package/
          (
            cd chrome-package
            zip -r ../notepeeker-chrome.zip .
          )
          (
            cd firefox-package
            zip -r ../notepeeker-firefox.zip .
          )

      - name: Publish latest GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: NotePeeker latest
          body: |
            Download `notepeeker-chrome.zip` for Chrome or `notepeeker-firefox.zip` for Firefox. Extract the selected ZIP and load the extracted folder as an unpacked extension.

            This release is built automatically from the latest push to `main`.
          files: |
            notepeeker-chrome.zip
            notepeeker-firefox.zip
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
