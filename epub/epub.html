<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EPUB - NotePeeker</title>
    <link rel="stylesheet" href="epub.css">
  </head>
  <body>
    <header class="toolbar" role="banner">
      <div class="brand">
        <img src="../components/icons/notepeeker-32.png" alt="" width="24" height="24">
        <span id="bookTitle">NotePeeker</span>
      </div>

      <div class="toolbarActions" aria-label="EPUB controls">
        <button id="previousChapter" class="iconButton" type="button" title="Previous chapter" aria-label="Previous chapter">&#8592;</button>
        <output id="chapterValue" class="chapterValue" aria-live="polite">- / -</output>
        <button id="nextChapter" class="iconButton" type="button" title="Next chapter" aria-label="Next chapter">&#8594;</button>
        <button id="fullWidthToggle" class="iconButton" type="button" title="Use full page width" aria-label="Use full page width" aria-pressed="false">&#8596;</button>
        <button id="themeToggle" class="iconButton" type="button" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
        <button id="printButton" class="iconButton" type="button" title="Print" aria-label="Print">&#9113;</button>
      </div>
    </header>

    <main class="viewport">
      <section id="status" class="status" aria-live="polite">Loading EPUB...</section>
      <article id="page" class="page epubPage" hidden></article>
    </main>

    <script src="../vendor/jszip.min.js"></script>
    <script src="epub.js"></script>
  </body>
</html>
